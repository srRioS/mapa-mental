<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Mental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="logo">🧠 MindMap</span>
        <button id="btn-new-map" class="btn-icon" title="Novo mapa"><i class="fa fa-plus"></i></button>
      </div>
      <div class="sidebar-section">
        <span class="section-label">Meus Mapas</span>
        <div id="maps-list"><p class="empty-msg">Nenhum mapa ainda</p></div>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <input id="map-title-input" type="text" placeholder="Nome do mapa..." maxlength="60" />
        <div class="topbar-actions">
          <button id="btn-save" class="btn primary"><i class="fa fa-floppy-disk"></i> Salvar</button>
          <button id="btn-add-child" class="btn"><i class="fa fa-circle-nodes"></i> Filho</button>
          <button id="btn-add-sibling" class="btn"><i class="fa fa-code-branch"></i> Irmão</button>
          <button id="btn-delete-node" class="btn danger"><i class="fa fa-trash"></i></button>
        </div>
      </header>
      <div id="canvas-wrap">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.18)" />
            </filter>
          </defs>
          <g id="scene"></g>
        </svg>
        <div id="ctx-menu">
          <div class="ctx-item" id="cm-edit"><i class="fa fa-pencil"></i> Editar texto</div>
          <div class="ctx-item" id="cm-image"><i class="fa fa-image"></i> Adicionar imagem</div>
          <div class="ctx-item" id="cm-child"><i class="fa fa-plus"></i> Adicionar filho</div>
          <div class="ctx-item" id="cm-sibling"><i class="fa fa-code-branch"></i> Adicionar irmão</div>
          <div class="ctx-sep"></div>
          <div class="ctx-item" id="cm-color"><i class="fa fa-palette"></i> Mudar cor</div>
          <div class="ctx-item danger" id="cm-del"><i class="fa fa-trash"></i> Excluir nó</div>
        </div>
        <div id="edit-box"><input id="edit-input" type="text" placeholder="Texto do nó..." /></div>
        <input type="file" id="img-input" accept="image/*" style="display:none" />
        <div id="toast"></div>
        <div id="zoom-controls">
          <button id="btn-zoom-in" title="Zoom +"><i class="fa fa-plus"></i></button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-out" title="Zoom -"><i class="fa fa-minus"></i></button>
          <button id="btn-zoom-reset" title="Resetar"><i class="fa fa-expand"></i></button>
        </div>
      </div>
    </main>
    <div id="img-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <h3>Imagem do nó</h3>
        <img id="modal-img" src="" alt="Imagem do nó" />
        <div class="modal-actions">
          <button id="modal-change" class="btn"><i class="fa fa-upload"></i> Trocar</button>
          <button id="modal-remove" class="btn danger"><i class="fa fa-trash"></i> Remover</button>
          <button id="modal-close" class="btn">Fechar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
